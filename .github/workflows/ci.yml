name: CI

on:
  pull_request:
  push:
    branches: [main, "release-*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11  # same as the Dockerfile
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  docker:
    name: Docker image boots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gulpy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Production mode with throwaway values. Fails if the app cannot start or /health does not answer.
      - name: Start and check /health
        run: |
          docker run -d --name gulpy -p 8080:8080 \
            -e GULPY_BASE_URL=http://localhost:8080 \
            -e GULPY_MASTER_KEY="$(openssl rand -base64 32)" \
            -e RESEND_API_KEY=ci-unused \
            -e MAIL_FROM="Gulpy CI <ci@example.com>" \
            gulpy:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs gulpy
          exit 1
