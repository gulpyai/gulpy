# Gulpy on one server: the app, and a Cloudflare tunnel that gives it a public https address.
# `deploy/release.sh` (GitHub Actions) sends a built image and starts this file. `scripts/deploy-vm.sh` set up the server.
# The secrets are on the server in /etc/gulpy, which only root can read. They are not in this repository.
# The test copy (test.gulpy.ai) uses the same file with the project gulpy-test, /etc/gulpy-test and its own image.
name: gulpy

services:
  gulpy:
    build:
      context: ..
    image: ${GULPY_IMAGE:-gulpy:latest}
    restart: unless-stopped
    # GULPY_BASE_URL, GULPY_MASTER_KEY, RESEND_API_KEY, MAIL_FROM
    env_file: ${GULPY_ETC:-/etc/gulpy}/env
    environment:
      GULPY_BACKUP_DIR: /data/backups
    volumes:
      - data:/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:8080/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ${GULPY_ETC:-/etc/gulpy}/cloudflared:/etc/cloudflared:ro
    depends_on:
      gulpy:
        condition: service_healthy
    mem_limit: 128m

volumes:
  # The SQLite file and its daily copies.
  data:
